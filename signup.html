<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Melora</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-welcome">

            <img
                src="assets/Images/melora-logo.png"
                alt="Melora Logo"
                class="login-logo"
            >

            <h1>Melora</h1>

            <p class="tagline">
                Connect People Through Music
            </p>

            <p class="welcome-text">
                Create your account and start discovering,
                sharing and enjoying music with your friends.
            </p>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-box">

            <h2>Create Account 🎵</h2>

            <p class="login-subtitle">
                Join Melora and discover your music world
            </p>


            <form id="signupForm">

                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- TERMS -->

                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    I agree to the Terms & Conditions

                </label>


                <br>


                <!-- SIGN UP BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Create Account
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <div
        id="signupToast"
        class="login-toast">
    </div>


<script>

/* =========================
   SIGN UP
========================= */

document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("signupEmail").value.trim();

        const password =
            document.getElementById("signupPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        /* CHECK PASSWORD */

        if (password !== confirmPassword) {

            showSignupToast(
                "Passwords do not match!"
            );

            return;
        }


        /* PASSWORD LENGTH */

        if (password.length < 6) {

            showSignupToast(
                "Password must contain at least 6 characters."
            );

            return;
        }


        try {

            const response = await fetch(
                "http://localhost:5000/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showSignupToast(data.message);

                return;
            }


            showSignupToast(
                "Account created successfully! 🎉"
            );


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1000);

        }

        catch (error) {

            console.error(error);

            showSignupToast(
                "Cannot connect to server."
            );

        }

    });

/* =========================
   TOAST
========================= */

function showSignupToast(message) {

    const toast =
        document.getElementById("signupToast");

    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(function() {

        toast.classList.remove("show");

    }, 2500);

}

</script>

</body>

</html>
