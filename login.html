<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Melora</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-welcome">

            <img
                src="assets/Images/melora-logo.png"
                alt="Melora Logo"
                class="login-logo"
            >

            <h1>Melora</h1>

            <p class="tagline">
                Connect People Through Music
            </p>

            <p class="welcome-text">
                Discover music, share your favourite songs,
                connect with friends and find your perfect vibe.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-box">

            <h2>Welcome Back! 👋</h2>

            <p class="login-subtitle">
                Login to continue to Melora
            </p>


            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- REMEMBER -->
                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#" onclick="forgotPassword()">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <!-- DEMO LOGIN -->
            <button
                class="demo-login-btn"
                onclick="demoLogin()"
            >
                Continue as Demo User
            </button>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                   Sign Up
                </a>

            </p>

        </div>

    </div>


    <div id="loginToast" class="login-toast"></div>


<script>

/* =========================
   LOGIN
========================= */

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        if (email === "" || password === "") {

            showLoginToast(
                "Please enter email and password."
            );

            return;
        }


        try {

            const response = await fetch(
                "http://localhost:5000/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showLoginToast(data.message);

                return;
            }


            /* SAVE LOGGED-IN USER */

            localStorage.setItem(
                "meloraUser",
                JSON.stringify(data.user)
            );


            showLoginToast(
                "Login successful! 🎵"
            );


            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1000);

        }

        catch (error) {

            console.error(error);

            showLoginToast(
                "Cannot connect to server."
            );

        }

    });

/* =========================
   DEMO LOGIN
========================= */

function demoLogin() {

    localStorage.setItem(
        "meloraUser",
        "demo@melora.com"
    );

    showLoginToast(
        "Welcome to Melora! 🎵"
    );

    setTimeout(function() {

        window.location.href =
            "index.html";

    }, 800);
}


/* =========================
   FORGOT PASSWORD
========================= */

function forgotPassword() {

    showLoginToast(
        "Password reset will be available soon."
    );

}


/* =========================
   SIGN UP
========================= */

function showSignup() {

    showLoginToast(
        "Sign Up feature will be added soon."
    );

}


/* =========================
   TOAST
========================= */

function showLoginToast(message) {

    const toast =
        document.getElementById("loginToast");

    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(function() {

        toast.classList.remove("show");

    }, 2500);

}

</script>

</body>
</html>
